<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>去屏東打怪</title>
<!-- viewport-fit=cover：iPhone 刘海/圆角机型上让画面铺满，安全区交给 CSS 的 env() 处理。
     禁掉缩放，否则手机上双击和捏合会缩放整个页面，虚拟按键连点就变成放大。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2d25">
<!-- 装到主屏幕后全屏运行（不带浏览器地址栏）。mobile- 是标准写法，apple- 是 iOS 的老写法，都要留 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="去屏東打怪">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<!-- iOS 加到主屏幕时不读 manifest 的 icons，只认 apple-touch-icon -->
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<!-- 离线缓存的注册代码，和 main.js 无关；file:// 或非 https 下会自己安静跳过 -->
<script type="module" src="./src/pwa.js"></script>
<style>
  /* 路径必须是相对的（./）。写成 /assets/... 时，部署到 user.github.io/仓库名/
     这种子目录下就会去根域名找字体，两个 woff2 一起 404，中文全变成方框。 */
  @font-face { font-family: "Fusion Pixel 12px"; src: url("./assets/fonts/fusion-pixel-12px-proportional-latin.otf.woff2") format("woff2"); unicode-range: U+0000-024F; }
  @font-face { font-family: "Fusion Pixel 12px"; src: url("./assets/fonts/fusion-pixel-12px-proportional-zh_hans.otf.woff2") format("woff2"); }
</style>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
    color: #666; font: 12px sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" width="512" height="448"></canvas>
<div id="hint">方向键/WASD 移动 · Z/Enter 确认 · X/Esc 菜单 · M 静音</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
